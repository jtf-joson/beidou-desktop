# DataAgent Workbench 工作区配置(文件即权威源,建议纳入 Git;密钥走环境变量)
name: 我的数据工作台

model:
  provider: deepseek-anthropic
  base_url: https://api.deepseek.com/anthropic
  # 二选一:环境变量名(推荐)或直接填 key(注意 gitignore)
  auth_token_env: DEEPSEEK_API_KEY
  model: deepseek-flash[1m]

starrocks:
  # 未配置 host 时默认启用 mock 演示数据(结果明确标注);设 mock: false 则未配置时直接报错
  mock: true
  host: ""            # 例如 sr-fe.internal
  port: 9030
  user: ""            # 只读账号!
  password: ""
  database: ""
  timeout_sec: 60

anymetrics:            # 北斗指标平台(元数据导入用;留空则只用本地导入)
  host: ""
  tenant_id: ""
  auth_value: ""

guard:
  max_row: 200
  sensitive_columns: []   # 例如 [vin, phone_no]
