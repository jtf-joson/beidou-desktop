# 实体与业务模型(轻量语义资产;YAML 即权威源)
# entities: 业务对象(对应维表/主数据)
# businessModels: 业务分析主题(指标组合 + 实体 + 关注维度)
entities:
  - name: 车辆
    description: 交付到用户的整车,智驾/座舱行为的主体
    dataset: dim_vehicle_property_df
    key: vin
    attributes: [config_level, veh_series_no, act_delivery_time, is_user_vehicle]
  - name: 客户
    description: 车主(购车/用车行为主体)
    attributes: [customer_id]
businessModels:
  - name: 智驾活跃
    description: 智驾功能的用户规模与使用强度
    entities: [车辆]
    metrics: [sum_highway_adas_odometer_days, all_adas_count_vin_day]
    dimensions: [dim_vehicle_property_df_config_level, dim_vehicle_property_df_veh_series_no]
  - name: 蓝牙钥匙使用
    description: 数字钥匙的使用活跃与留存
    entities: [车辆]
    metrics: [sentry_mode_durs]
    dimensions: [dim_vehicle_property_df_config_level]
